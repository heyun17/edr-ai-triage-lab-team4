name: Build API image to GHCR

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - src/**
      - data/telemetry/**
      - .github/workflows/build-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/heyun17/edr-ai-triage-lab-team4:stage1
