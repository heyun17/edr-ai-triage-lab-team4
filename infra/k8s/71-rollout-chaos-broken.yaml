# D3-2 / 7-1 - deliberately crash only the ISOLATED test deployment.
# Old healthy ReplicaSet should remain ready (maxUnavailable: 0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-api-rollout-chaos
  namespace: soc
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: soc-api-rollout-chaos
  template:
    metadata:
      labels:
        app: soc-api-rollout-chaos
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo 'Intentional D3-2 7-1 crash'; exit 1"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
