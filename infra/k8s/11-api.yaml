apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/heyun17/edr-ai-triage-lab-team4:stage1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BACKEND
              value: "memory"
            - name: CHECKPOINTER
              value: "memory"
            - name: FAKE_LLM
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: soc
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
