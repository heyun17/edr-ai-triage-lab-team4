# D3-6: 21-question evaluation against OCR-enhanced index; does not change production.
apiVersion: batch/v1
kind: Job
metadata:
  name: soc-rag-ocr-eval
  namespace: soc
  labels:
    app: soc-rag-ocr-eval
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: soc-rag-ocr-eval
    spec:
      restartPolicy: Never
      containers:
        - name: rag-ocr-eval
          image: ghcr.io/heyun17/edr-ai-triage-lab-team4:kb-ocr-day3-20261119
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "soc.eval.rag_eval", "--mode", "all", "--k", "3"]
          env:
            - name: BACKEND
              value: "real"
            - name: OPENSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: soc-config
                  key: OPENSEARCH_URL
            - name: INDEX_KB
              value: "kb-playbooks-ocr"
            - name: FAKE_LLM
              value: "false"
            - name: EMBED_MODEL
              value: "text-embedding-3-small"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-openai
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
